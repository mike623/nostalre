name: nostalRE
options:
  bundleIdPrefix: io.github.mikewong
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: Z6KK7N4RQ4
    CODE_SIGN_STYLE: Automatic
targets:
  nostalRE:
    type: application
    platform: iOS
    sources:
      - path: main.m
    preBuildScripts:
      - name: Build Rust client
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikewong.nostalre
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        ENABLE_BITCODE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        # the static library by path: -l would pick cargo's libnostalre_client.dylib beside it
        "RUST_DIR[sdk=iphonesimulator*]": "$(SRCROOT)/../target/aarch64-apple-ios-sim/release"
        "RUST_DIR[sdk=iphoneos*]": "$(SRCROOT)/../target/aarch64-apple-ios/release"
        OTHER_LDFLAGS: "$(RUST_DIR)/libnostalre_client.a $(RUST_DIR)/liblua5.1.a -liconv -lobjc -lc++ -framework Metal -framework QuartzCore -framework UIKit -framework Foundation -framework CoreGraphics -framework CoreFoundation -framework AudioToolbox -framework AVFoundation -framework CoreAudio -framework Security -framework SystemConfiguration -framework GameController -framework CoreHaptics"
        INFOPLIST_FILE: Info.plist
