[package]
name = "nostalre-network"
version = "0.1.0"
edition = "2024"

[dependencies]
nostalre-game = { workspace = true }
nostalre-profiling = { workspace = true }
packets = { workspace = true }
models = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
encoding_rs = { workspace = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
